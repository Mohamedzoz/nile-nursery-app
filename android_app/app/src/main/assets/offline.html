<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>حضانة النيل - تحت الصيانة والتحديث</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', system-ui, -apple-system, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #f0fdf4 0%, #e0f2fe 50%, #fef2f2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px 16px;
            color: #1e293b;
            text-align: center;
            overflow-x: hidden;
        }

        .offline-card {
            background: rgba(255, 255, 255, 0.94);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 32px;
            padding: 36px 24px;
            max-width: 440px;
            width: 100%;
            box-shadow: 0 25px 60px -15px rgba(14, 165, 233, 0.18), 0 15px 30px -10px rgba(0, 0, 0, 0.05);
            animation: card-appear 0.7s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
            position: relative;
        }

        @keyframes card-appear {
            0% { opacity: 0; transform: translateY(30px) scale(0.92); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .logo-wrap {
            position: relative;
            width: 160px;
            height: 160px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-aura {
            position: absolute;
            inset: -10px;
            background: radial-gradient(circle, rgba(56, 189, 248, 0.25) 0%, rgba(244, 63, 94, 0.15) 50%, transparent 75%);
            border-radius: 50%;
            animation: pulse-aura 3s infinite alternate;
        }

        @keyframes pulse-aura {
            0% { transform: scale(0.92); opacity: 0.6; }
            100% { transform: scale(1.08); opacity: 1; }
        }

        .logo-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            position: relative;
            z-index: 2;
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.08));
        }

        .badge-status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 6px 14px;
            background: #fef3c7;
            border: 1px solid #fde68a;
            color: #b45309;
            font-size: 13px;
            font-weight: 800;
            border-radius: 20px;
            margin-bottom: 16px;
        }

        .badge-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #f59e0b;
            box-shadow: 0 0 8px #f59e0b;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        h1 {
            font-size: 22px;
            font-weight: 900;
            color: #0f172a;
            margin-bottom: 10px;
            line-height: 1.4;
        }

        p {
            font-size: 14.5px;
            color: #64748b;
            line-height: 1.7;
            margin-bottom: 26px;
            font-weight: 600;
        }

        .actions-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn-retry {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, #0284c7 0%, #0369a1 100%);
            color: white;
            border: none;
            border-radius: 16px;
            font-size: 15px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 8px 20px -4px rgba(2, 132, 199, 0.4);
            transition: all 0.25s;
        }

        .btn-retry:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 24px -4px rgba(2, 132, 199, 0.5);
        }

        .btn-retry:active {
            transform: scale(0.98);
        }

        .btn-support {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 12px 20px;
            background: #f0fdf4;
            color: #15803d;
            border: 1.5px solid #bbf7d0;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 800;
            text-decoration: none;
            transition: all 0.2s;
        }

        .btn-support:hover {
            background: #dcfce7;
            color: #166534;
        }

        .spin-icon {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="offline-card">
        <!-- Logo Wrap -->
        <div class="logo-wrap">
            <div class="logo-aura"></div>
            <img src="uploads/nile_nursery_logo.png" alt="شعار حضانة النيل" class="logo-img" onerror="this.src='assets/icons/icon-192x192.png'">
        </div>

        <!-- Status Badge -->
        <div class="badge-status">
            <span class="badge-dot"></span>
            <span>تحديثات وصيانة دورية 🛠️</span>
        </div>

        <!-- Heading -->
        <h1>التطبيق تحت الصيانة والتحديث</h1>

        <!-- Friendly Description -->
        <p>
            نعمل حالياً على تحسين وتطوير خدمات <strong>حضانة النيل</strong> لتقديم أفضل تجربة رعاية وتعليم لكم ولأطفالكم الأعزاء.<br>
            يرجى التأكد من اتصالك بالإنترنت وإعادة المحاولة.
        </p>

        <!-- Action Buttons -->
        <div class="actions-group">
            <button type="button" id="btnRetry" class="btn-retry" onclick="triggerRetry()">
                <i class="fa-solid fa-rotate-right" id="retryIcon"></i>
                <span>إعادة المحاولة والتحديث</span>
            </button>

            <a href="https://wa.me/201000000000" id="btnWhatsapp" target="_blank" class="btn-support">
                <i class="fa-brands fa-whatsapp text-lg"></i>
                <span>تواصل مع إدارة الروضة عبر واتساب</span>
            </a>
        </div>
    </div>

    <script>
        function triggerRetry() {
            const icon = document.getElementById('retryIcon');
            const btn = document.getElementById('btnRetry');
            
            icon.classList.add('spin-icon');
            btn.style.opacity = '0.7';
            btn.style.pointerEvents = 'none';

            setTimeout(() => {
                // If in Android WebView or browser, attempt to reload the home page
                if (window.Android && window.Android.reloadApp) {
                    window.Android.reloadApp();
                } else {
                    window.location.href = 'index.php?retry=' + new Date().getTime();
                }
            }, 800);
        }

        // Auto-check connection when back online
        window.addEventListener('online', () => {
            triggerRetry();
        });
    </script>
</body>
</html>
